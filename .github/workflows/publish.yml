name: Build & Publish to NPM

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  test:
    name: Final Tests Before Publish
    runs-on: [self-hosted, linux]

    steps:
      - name: Reset workspace ownership
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace busybox chown -R "$(id -u):$(id -g)" /workspace 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # npm isn't on the self-hosted runner: run the pre-publish gate
      # (install/audit/build/test + pack dry-run) inside a throwaway
      # node:20-alpine container (Docker Hub pull).
      - name: Audit, build, test, verify package (node:20-alpine)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            node:20-alpine sh -c '
              set -e
              npm ci --no-audit --no-fund
              npm audit --audit-level=high
              npm run build
              npm test
              npm pack --dry-run
            '

      - name: Clean up
        if: always()
        run: |
          docker image prune -f || true
          df -h || true

  publish:
    name: Publish to NPM Registry
    runs-on: [self-hosted, linux]
    needs: test
    if: success()

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Reset workspace ownership
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace busybox chown -R "$(id -u):$(id -g)" /workspace 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # git IS on the runner (actions/checkout uses it); only node/npm are
      # missing and get run inside throwaway node:20-alpine containers below.
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # npm/node aren't on the self-hosted runner. Install deps + build inside
      # a throwaway node:20-alpine container (Docker Hub pull); the dist/
      # output lands in the mounted workspace for the publish steps below.
      - name: Install dependencies and build (node:20-alpine)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            node:20-alpine sh -c 'set -e; npm ci --no-audit --no-fund; npm run build'

      - name: Check if version needs update
        id: version_check
        run: |
          set -euo pipefail
          # node/npm live only in a throwaway container on this runner; shadow
          # them with wrapper functions so the original logic is unchanged.
          # The workspace is bind-mounted, so package.json edits persist on the
          # host between calls.
          node() { docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace node:20-alpine node "$@"; }
          npm()  { docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace node:20-alpine npm  "$@"; }

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view mcp-financex version 2>/dev/null || echo "0.0.0")
          echo "Current package.json version: $PACKAGE_VERSION"
          echo "Published npm version: $NPM_VERSION"

          # Use Node.js to compare semantic versions (without external dependencies)
          NEEDS_BUMP=$(node -e "
            function compareVersions(v1, v2) {
              const parts1 = v1.split('.').map(Number);
              const parts2 = v2.split('.').map(Number);

              for (let i = 0; i < 3; i++) {
                const p1 = parts1[i] || 0;
                const p2 = parts2[i] || 0;
                if (p1 > p2) return 1;
                if (p1 < p2) return -1;
              }
              return 0;
            }

            const pkgVersion = '$PACKAGE_VERSION';
            const npmVersion = '$NPM_VERSION';
            const comparison = compareVersions(pkgVersion, npmVersion);

            // If package version is less than or equal to npm version, needs bump
            console.log(comparison <= 0 ? 'true' : 'false');
          ")

          echo "needs_bump=$NEEDS_BUMP" >> $GITHUB_OUTPUT

          if [ "$NEEDS_BUMP" = "true" ]; then
            echo "⚠️ Version needs to be bumped (package.json: $PACKAGE_VERSION <= npm: $NPM_VERSION)"
          else
            echo "✅ Version is already newer (package.json: $PACKAGE_VERSION > npm: $NPM_VERSION)"
          fi

      - name: Bump version
        if: steps.version_check.outputs.needs_bump == 'true'
        run: |
          set -euo pipefail
          # Same container-backed node/npm wrappers as the version-check step.
          node() { docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace node:20-alpine node "$@"; }
          npm()  { docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace node:20-alpine npm  "$@"; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TYPE="${{ github.event.inputs.version }}"
          else
            VERSION_TYPE="patch"
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view mcp-financex version 2>/dev/null || echo "0.0.0")

          echo "Bumping version: $VERSION_TYPE"
          echo "Starting from package.json: $PACKAGE_VERSION"
          echo "Published npm version: $NPM_VERSION"

          # Bump version without creating git tag
          npm version $VERSION_TYPE --no-git-tag-version
          BUMPED_VERSION=$(node -p "require('./package.json').version")
          echo "After bump: $BUMPED_VERSION"

          # Check if bumped version is still <= npm version
          STILL_NEEDS_BUMP=$(node -e "
            function compareVersions(v1, v2) {
              const parts1 = v1.split('.').map(Number);
              const parts2 = v2.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                const p1 = parts1[i] || 0;
                const p2 = parts2[i] || 0;
                if (p1 > p2) return 1;
                if (p1 < p2) return -1;
              }
              return 0;
            }
            console.log(compareVersions('$BUMPED_VERSION', '$NPM_VERSION') <= 0 ? 'true' : 'false');
          ")

          # If still not greater than npm version, keep bumping
          while [ "$STILL_NEEDS_BUMP" = "true" ]; do
            echo "⚠️ Bumped version $BUMPED_VERSION is still <= npm version $NPM_VERSION, bumping again..."
            npm version $VERSION_TYPE --no-git-tag-version
            BUMPED_VERSION=$(node -p "require('./package.json').version")
            STILL_NEEDS_BUMP=$(node -e "
              function compareVersions(v1, v2) {
                const parts1 = v1.split('.').map(Number);
                const parts2 = v2.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  const p1 = parts1[i] || 0;
                  const p2 = parts2[i] || 0;
                  if (p1 > p2) return 1;
                  if (p1 < p2) return -1;
                }
                return 0;
              }
              console.log(compareVersions('$BUMPED_VERSION', '$NPM_VERSION') <= 0 ? 'true' : 'false');
            ")
          done

          NEW_VERSION=$BUMPED_VERSION
          echo "✅ Final version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Create git commit and tag
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"

      - name: Get current version
        if: steps.version_check.outputs.needs_bump == 'false'
        run: |
          set -euo pipefail
          NEW_VERSION=$(docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace node:20-alpine node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEW_VERSION }}
          release_name: Release v${{ env.NEW_VERSION }}
          body: |
            ## Changes in v${{ env.NEW_VERSION }}

            ### Installation
            ```bash
            npm install -g mcp-financex
            ```

            ### Usage with Claude Desktop
            ```json
            {
              "mcpServers": {
                "finance": {
                  "command": "npx",
                  "args": ["-y", "mcp-financex"]
                }
              }
            }
            ```

            See [DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/main/DEPLOYMENT.md) for more details.
          draft: false
          prerelease: false
        continue-on-error: true

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # npm isn't on the runner; publish from a throwaway node:20-alpine
          # container. The registry auth token plus the GitHub OIDC / context
          # env vars are forwarded so `npm publish --provenance` can mint its
          # provenance attestation from inside the container (OIDC token
          # request + sigstore are outbound HTTPS, which works from the
          # container). See the workflow README / commit note: provenance on a
          # self-hosted runner is not guaranteed; if it fails, drop
          # `--provenance`.
          docker run --rm \
            -e NODE_AUTH_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e GITHUB_ACTIONS -e GITHUB_WORKFLOW -e GITHUB_WORKFLOW_REF \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_RUN_NUMBER \
            -e GITHUB_REPOSITORY -e GITHUB_REPOSITORY_ID \
            -e GITHUB_REPOSITORY_OWNER -e GITHUB_REPOSITORY_OWNER_ID \
            -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_SHA \
            -e GITHUB_EVENT_NAME -e GITHUB_SERVER_URL -e GITHUB_API_URL \
            -e GITHUB_JOB -e RUNNER_ENVIRONMENT \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            node:20-alpine sh -c '
              set -e
              npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
              npm publish --provenance --access public
            '

      - name: Push version bump to main
        if: steps.version_check.outputs.needs_bump == 'true'
        run: |
          # This will succeed if GH_PAT is configured with bypass permissions
          # Otherwise it will fail but continue without breaking the workflow
          git push origin main --follow-tags || echo "⚠️ Could not push to main (needs GH_PAT with bypass permissions)"
        continue-on-error: true

      - name: Create package tarball
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace node:20-alpine npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-v${{ env.NEW_VERSION }}
          path: mcp-financex-*.tgz
          retention-days: 90

      - name: Publish Summary
        run: |
          echo "## 🚀 Package Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** mcp-financex" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** https://www.npmjs.com/package/mcp-financex" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npx -y mcp-financex" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage in Claude Desktop" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '{' >> $GITHUB_STEP_SUMMARY
          echo '  "mcpServers": {' >> $GITHUB_STEP_SUMMARY
          echo '    "finance": {' >> $GITHUB_STEP_SUMMARY
          echo '      "command": "npx",' >> $GITHUB_STEP_SUMMARY
          echo '      "args": ["-y", "mcp-financex"]' >> $GITHUB_STEP_SUMMARY
          echo '    }' >> $GITHUB_STEP_SUMMARY
          echo '  }' >> $GITHUB_STEP_SUMMARY
          echo '}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # This job builds the package (tsc) and produces a root-owned tarball in
      # the shared runner workspace via the container steps. Remove the tarball
      # and sweep dangling images so the persistent runner disk doesn't fill
      # across releases. Never fails the job.
      - name: Clean up build artifacts and images
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE"/*.tgz 2>/dev/null || true
          docker image prune -f || true
          df -h || true

  notify-failure:
    name: Notify on Failure
    runs-on: [self-hosted, linux]
    needs: [test, publish]
    if: failure()

    steps:
      - name: Failure Summary
        run: |
          echo "## ❌ Publish Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The publish workflow encountered an error." >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "- NPM_TOKEN secret not configured" >> $GITHUB_STEP_SUMMARY
          echo "- Tests failed" >> $GITHUB_STEP_SUMMARY
          echo "- Version already exists on npm" >> $GITHUB_STEP_SUMMARY
          echo "- Build errors" >> $GITHUB_STEP_SUMMARY

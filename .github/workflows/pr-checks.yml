  trivy-security:
    name: Trivy Security Scan
    runs-on: [self-hosted, linux]
    continue-on-error: true

    steps:
      - name: Reset workspace ownership
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace busybox chown -R "$(id -u):$(id -g)" /workspace 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      # The aquasecurity/trivy-action pins an internal setup step to a mutable
      # upstream tag that has been deleted, and the self-hosted runner has no
      # passwordless sudo, so Trivy is installed from its release tarball into
      # $HOME/.local/bin + $GITHUB_PATH — the sibling repos' proven no-sudo
      # pattern (AgentHub/SwitchBoard security jobs).
      - name: Install Trivy
        run: |
          set -euo pipefail
          VERSION=0.70.0
          curl -fsSL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/trivy.tgz -C "$HOME/.local/bin" trivy
          chmod +x "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      # Findings print to the job log; --exit-code 1 fails the job on
      # CRITICAL/HIGH (this job is continue-on-error, so it never blocks the
      # PR). --ignore-unfixed keeps the gate actionable, matching the sibling
      # repos' Trivy filesystem scan.
      - name: Run Trivy filesystem scan
        run: |
          set -euo pipefail
          trivy fs . \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress

  build-test:
    name: Build & Package Test
    runs-on: [self-hosted, linux]

    steps:
      - name: Reset workspace ownership
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace busybox chown -R "$(id -u):$(id -g)" /workspace 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      # npm isn't on the self-hosted runner: build the project and produce
      # the package tarball inside a throwaway node:20-alpine container
      # (Docker Hub pull). dist/ and the .tgz land in the mounted workspace
      # for actions/upload-artifact to collect.
      - name: Build and pack (node:20-alpine)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            node:20-alpine sh -c '
              set -e
              npm ci --no-audit --no-fund
              npm run build
              if [ ! -d dist ]; then
                echo "Error: dist/ directory not found after build"
                exit 1
              fi
              echo "Build successful - dist/ directory created"
              npm pack
              tar -tzf mcp-financex-*.tgz
              echo "Package contents verified"
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            dist/
            *.tgz
          retention-days: 7

      # The build runs as root in the container, leaving a root-owned tarball
      # (plus dist/) in the shared runner workspace. Remove the tarball and
      # sweep dangling images so the persistent runner disk doesn't accumulate
      # package output across runs. Never fails the job.
      - name: Clean up build artifacts
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE"/*.tgz 2>/dev/null || true
          docker image prune -f || true
          df -h || true

  pr-summary:
    name: PR Summary
    runs-on: [self-hosted, linux]
    needs: [security-and-quality, build-test]
    if: always()

    steps:
      - name: Check if required jobs failed
        run: |
          # Only fail on core checks (security-and-quality, build-test)
          # Trivy runs separately and will fail independently if vulnerabilities found
          if [[ "${{ needs.security-and-quality.result }}" == "failure" ]] || \
             [[ "${{ needs.build-test.result }}" == "failure" ]]; then
            echo "## ❌ PR Quality Checks Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Required checks failed:" >> $GITHUB_STEP_SUMMARY
            echo "- Security and Quality: ${{ needs.security-and-quality.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Build and Package: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Please fix the failing required checks before merging.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✅ All Required PR Checks Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Security and quality checks completed" >> $GITHUB_STEP_SUMMARY
            echo "✅ Build and package test completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**This PR is ready to merge! 🚀**" >> $GITHUB_STEP_SUMMARY
          fi

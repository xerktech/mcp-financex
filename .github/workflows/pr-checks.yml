name: PR Quality Checks

on:
  pull_request:
    branches: 
      - main
  workflow_dispatch:

jobs:
  security-and-quality:
    name: Security & Code Quality
    runs-on: [self-hosted, linux]

    strategy:
      matrix:
        node-version: ['18', '20', '22']

    steps:
      # Docker steps below run as root and leave root-owned files in the
      # persistent/shared runner workspace; reset ownership up front so
      # checkout and later steps aren't blocked by a prior run's leftovers.
      - name: Reset workspace ownership
        run: docker run --rm -v "$GITHUB_WORKSPACE":/workspace busybox chown -R "$(id -u):$(id -g)" /workspace 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      # Secret scan runs before dependencies are installed so trufflehog
      # doesn't crawl node_modules. The self-hosted runner can't authenticate
      # to ghcr.io, so we run trufflehog from its Docker Hub image directly
      # instead of the trufflesecurity/trufflehog action (a ghcr-based Docker
      # action). --only-verified --fail keeps the original gate: a verified
      # secret fails the job.
      - name: Check for secrets (trufflehog)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace \
            trufflesecurity/trufflehog:latest \
            filesystem /workspace --only-verified --fail

      # npm isn't installed on the self-hosted runner, so the whole npm
      # workflow (install/audit/build/test/format/lint) runs inside a
      # throwaway node:<matrix>-alpine container (Docker Hub pull), mirroring
      # AgentHub's glasses-ci.yml. Informational checks (outdated, formatting)
      # keep their original non-blocking behaviour with `|| true`;
      # audit/build/test/lint stay hard gates via `set -e`.
      - name: Install, audit, build, test, lint (node ${{ matrix.node-version }})
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            node:${{ matrix.node-version }}-alpine sh -c '
              set -e
              npm ci --no-audit --no-fund
              npm audit --audit-level=high
              npm outdated || true
              npm run build
              npm test
              npm run format -- --check || true
              npm run lint
            '

      # Sweep dangling layers the container work left behind so the shared
      # runner disk stays at a steady state. Never fails the job.
      - name: Clean up
        if: always()
        run: |
          docker image prune -f || true
          df -h || true

